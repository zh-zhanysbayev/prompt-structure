<index.html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор промптов</title>
<style>
body[data-theme="light"] {
  --bg: #f5f5f5; --text: #1a1a1a; --accent: #4a90d9;
  --field: #ffffff; --border: #d0d0d0; --onacc: #1a1a1a;
}
body[data-theme="dark"] {
  --bg: #1a1a1a; --text: #f5f5f5; --accent: #4a90d9;
  --field: #2a2a2a; --border: #444444; --onacc: #1a1a1a;
}
body[data-theme="mono"] {
  --bg: #ffffff; --text: #1a1a1a; --accent: #808080;
  --field: #e0e0e0; --border: #808080; --onacc: #1a1a1a;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 16px; line-height: 1.4;
}
main { max-width: 720px; margin: 0 auto; }
header {
  display: flex; flex-wrap: wrap; gap: 12px;
  align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
h1 { margin: 0; font-size: 24px; }
h2 { margin: 0 0 4px; font-size: 20px; }
.themes { display: flex; gap: 4px; }
button {
  font: inherit; color: var(--text); background: var(--field);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 8px 14px; cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: default; }
button.active, button.primary {
  background: var(--accent); color: var(--onacc); border-color: var(--accent);
}
.progress-label { margin-bottom: 6px; }
.bar {
  height: 10px; background: var(--field);
  border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  margin-bottom: 20px;
}
#bar-fill { height: 100%; width: 0; background: var(--accent); }
.hint { margin: 0 0 12px; opacity: 0.8; }
textarea, pre {
  width: 100%; margin: 0; padding: 10px;
  color: var(--text); background: var(--field);
  border: 1px solid var(--border); border-radius: 4px;
}
textarea { min-height: 180px; font: inherit; resize: vertical; }
pre {
  min-height: 180px; white-space: pre-wrap; word-wrap: break-word;
  font-family: Consolas, "Courier New", monospace; font-size: 14px;
  user-select: text;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.actions .spacer { flex: 1; }
.hidden { display: none; }
</style>
</head>
<body data-theme="light">
<main>
  <header>
    <h1>Конструктор промптов</h1>
    <div class="themes" id="themes">
      <button type="button" data-theme-btn="light">Светлая</button>
      <button type="button" data-theme-btn="dark">Тёмная</button>
      <button type="button" data-theme-btn="mono">Монохром</button>
    </div>
  </header>

  <section id="form-screen">
    <div class="progress-label" id="progress-label">Шаг 1 из 6</div>
    <div class="bar"><div id="bar-fill"></div></div>
    <h2 id="step-title"></h2>
    <p class="hint" id="step-hint"></p>
    <textarea id="field" aria-label="Поле шага"></textarea>
    <div class="actions">
      <button type="button" id="btn-back">Назад</button>
      <button type="button" id="btn-skip">Пропустить</button>
      <span class="spacer"></span>
      <button type="button" id="btn-next" class="primary">Дальше</button>
    </div>
  </section>

  <section id="result-screen" class="hidden">
    <h2>Готовый промпт</h2>
    <p class="hint" id="result-hint"></p>
    <pre id="result" tabindex="0"></pre>
    <div class="actions">
      <button type="button" id="btn-copy" class="primary">Скопировать</button>
      <button type="button" id="btn-restart">Начать заново</button>
    </div>
  </section>
</main>

<script>
const STEPS = [
  { key: 'role',        title: 'Роль',         head: 'РОЛЬ',
    hint: 'Кем должна быть модель?',
    ph: 'Ты — …' },
  { key: 'task',        title: 'Задача',       head: 'ЗАДАЧА',
    hint: 'Одно конкретное действие, которое нужно выполнить.',
    ph: 'Что сделать — одно действие' },
  { key: 'context',     title: 'Контекст',     head: 'КОНТЕКСТ',
    hint: 'Что модели нужно знать о ситуации и о вас.',
    ph: 'Кто я, зачем, ограничения' },
  { key: 'format',      title: 'Формат',       head: 'ФОРМАТ',
    hint: 'Длина, структура и стиль ответа.',
    ph: 'Как выглядит ответ' },
  { key: 'constraints', title: 'Ограничения',  head: 'ОГРАНИЧЕНИЯ',
    hint: 'Что модели делать нельзя.',
    ph: 'Чего не делать' },
  { key: 'example',     title: 'Пример',       head: 'ПРИМЕР',
    hint: 'Образец желаемого ответа.',
    ph: 'Образец' }
];
const THEMES = ['light', 'dark', 'mono'];
const PREFIX = 'pc_';

// localStorage может быть недоступен (режим приватности и т.п.) — не падаем
function lsGet(k) {
  try { return localStorage.getItem(PREFIX + k); } catch (e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(PREFIX + k, v); } catch (e) { /* ignore */ }
}
function lsDel(k) {
  try { localStorage.removeItem(PREFIX + k); } catch (e) { /* ignore */ }
}

const $ = id => document.getElementById(id);
const values = {};
let step = 0;

STEPS.forEach(s => { values[s.key] = lsGet(s.key) || ''; });

function applyTheme(name) {
  if (THEMES.indexOf(name) === -1) name = 'light';
  document.body.setAttribute('data-theme', name);
  document.querySelectorAll('[data-theme-btn]').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-theme-btn') === name);
  });
  lsSet('theme', name);
}

function saveField(key, value) {
  values[key] = value;
  if (value === '') lsDel(key); else lsSet(key, value);
}

function renderStep() {
  const s = STEPS[step];
  $('progress-label').textContent = 'Шаг ' + (step + 1) + ' из ' + STEPS.length;
  $('bar-fill').style.width = ((step + 1) / STEPS.length * 100) + '%';
  $('step-title').textContent = s.title;
  $('step-hint').textContent = s.hint;
  $('field').placeholder = s.ph;
  $('field').value = values[s.key];
  $('btn-back').disabled = step === 0;
  $('btn-next').textContent = step === STEPS.length - 1 ? 'Собрать промпт' : 'Дальше';
  $('field').focus();
}

function buildPrompt() {
  return STEPS
    .filter(s => values[s.key].trim() !== '')
    .map(s => '## ' + s.head + '\n' + values[s.key].trim())
    .join('\n\n');
}

function showResult() {
  const text = buildPrompt();
  $('result').textContent = text;
  $('result-hint').textContent = text ? '' : 'Все поля пустые — вернитесь и заполните хотя бы одно.';
  $('btn-copy').textContent = 'Скопировать';
  $('btn-copy').disabled = text === '';
  $('form-screen').classList.add('hidden');
  $('result-screen').classList.remove('hidden');
}

function showForm() {
  $('result-screen').classList.add('hidden');
  $('form-screen').classList.remove('hidden');
  renderStep();
}

function goNext() {
  if (step < STEPS.length - 1) { step++; renderStep(); } else { showResult(); }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
  return ok;
}

function copyPrompt() {
  const text = $('result').textContent;
  const done = ok => {
    $('btn-copy').textContent = ok ? 'Скопировано' : 'Не удалось — выделите текст вручную';
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text)));
  } else {
    done(fallbackCopy(text));
  }
}

function restart() {
  STEPS.forEach(s => { saveField(s.key, ''); });
  step = 0;
  showForm();
}

$('field').addEventListener('input', e => saveField(STEPS[step].key, e.target.value));
$('btn-back').addEventListener('click', () => { if (step > 0) { step--; renderStep(); } });
$('btn-skip').addEventListener('click', goNext);
$('btn-next').addEventListener('click', goNext);
$('btn-copy').addEventListener('click', copyPrompt);
$('btn-restart').addEventListener('click', restart);
$('themes').addEventListener('click', e => {
  const name = e.target.getAttribute('data-theme-btn');
  if (name) applyTheme(name);
});

applyTheme(lsGet('theme') || 'light');
renderStep();
</script>
</body>
</html>
